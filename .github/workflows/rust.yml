name: Rust Build

on:
  push:
    tags:
    - 'v*.*.*'
  workflow_dispatch:
    inputs:
      manual_tag:
        description: 'Tag name (e.g., v0.2.2)'
        required: true
        default: 'manual-build'

env:
  CARGO_TERM_COLOR: always
  RUST_CLIPPY_ARGS: "-D warnings"
  RUST_VERSION: "1.99.0"
  BIN_NAME: "todo-cli"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-${{ matrix.os }}-${{ env.RUST_VERSION }}"
      
      - name: Run Tests
        run: cargo test --all-features --workspace
      
      - name: Clippy Lints
        run: cargo clippy --all-targets --all-features -- ${{ env.RUST_CLIPPY_ARGS }}
  build:
    name: Binary (${{ matrix.suffix }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  suffix: linux,   ext: "" }
          - { os: windows-latest, suffix: windows, ext: ".exe" }
          - { os: macos-latest,   suffix: macos,   ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_VERSION }}
    
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
    
    - name: Build Release Binary
      run: cargo build --release --locked
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.BIN_NAME }}-${{ github.event.inputs.manual_tag || github.ref_name }}-${{ matrix.suffix }}
        path: target/release/${{ env.BIN_NAME }}${{ matrix.ext }}
        if-no-files-found: 'error'
        retention-days: 7
