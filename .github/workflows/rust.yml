name: Rust

on:
  push:
    tags:
    - 'v*.*.*'
  workflow_dispatch:
    inputs:
      manual_tag:
        description: 'Tag name (e.g., v0.2.2)'
        required: true
        default: 'manual-build'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.name }}
    steps:
      - id: set_tag
        env: 
          INPUT_TAG: ${{ github.event.inputs.manual_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG;-$REF_NAME}" >> $GITHUB_OUTPUT
  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        rust: [1.99.0]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-${{ matrix.os }}-${{ matrix.rust }}"
      
      - name: Run Tests
        run: cargo test --all-features --workspace
      
      - name: Clippy Lints
        run: cargo clippy --all-targets --all-features -- -D warnings
  build:
    name: Production Binary
    needs: 
      - test
      - config
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
          - os: ubuntu-latest-arm
            suffix: linux-arm64
          - os: windows-latest
            suffix: windows-x64
          - os: macos-latest
            suffix: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.85.0
    
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
    
    - name: Build Release Binary
      run: cargo build --release --locked
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: todo-cli-${{ matrix.suffix }}
        path: target/release/${{ needs.config.outputs.tag }}_${{ matrix.suffix }}
        retention-days: 7
