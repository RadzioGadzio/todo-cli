name: Rust Build

on:
  push:
    tags:
    - 'v*.*.*'
  workflow_dispatch:
    inputs:
      manual_tag:
        description: 'Tag name (e.g., v0.2.2)'
        required: true
        default: 'manual-build'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ github.repository.name }}
      tag: ${{ steps.tag.outputs.tag }}
      os: ${{ steps.os.outputs.os }}
      arch: ${{ steps.arch.outputs.arch }}
    steps:
      - id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.manual_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_NAME}" >> $GITHUB_OUTPUT
      - id: os
        run: echo "os=["ubuntu-latest", "windows-latest", "macos-latest"]" >> $GITHUB_OUTPUT
      - id: arch
        run: echo "arch=["x64", "arm64"]" >> $GITHUB_OUTPUT
  test:
    needs: config
    name: Test Suite (${{ matrix.os }}-${{ matrix.arch }}) | Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.config.outputs.os) }}
        arch: ${{ fromJSON(needs.config.outputs.arch) }}
        rust: [1.99.0]
        exclude:
          - os: macos-latest
            arch: x64
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.rust }}"
      
      - name: Run Tests
        run: cargo test --all-features --workspace
      
      - name: Clippy Lints
        run: cargo clippy --all-targets --all-features -- -D warnings
  build:
    name: Production Binary
    needs: 
      - test
      - config
    strategy:
      matrix:
        os: ${{ fromJSON(needs.config.outputs.os) }}
        arch: ${{ fromJSON(needs.config.outputs.arch) }}
        include:
          - os: ubuntu-latest
            suffix: linux
          - os: windows-latest
            suffix: windows
          - os: macos-latest
            suffix: macos
        exclude:
          - os: macos-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.85.0
    
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
    
    - name: Build Release Binary
      run: cargo build --release --locked
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ needs.config.outputs.name }}-${{ matrix.suffix }}-${{ matrix.arch }}
        path: target/release/${{ needs.config.outputs.tag }}_${{ matrix.suffix }}-${{ matrix.arch }}
        retention-days: 7
