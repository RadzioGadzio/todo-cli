name: Rust Build

on:
  push:
    tags:
    - 'v*.*.*'
  workflow_dispatch:
    inputs:
      manual_tag:
        description: 'Tag name (e.g., v0.2.2)'
        required: true
        default: 'manual-build'

env:
  CARGO_TERM_COLOR: always
  RUST_CLIPPY_ARGS: "-D warnings"
  RUST_VERSION: "1.99.0"
  BIN_NAME: "todo-cli"
  VERSION: ${{ github.event.inputs.manual_tag || github.ref_name }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-${{ matrix.os }}-${{ env.RUST_VERSION }}"
      
      - name: Run Tests
        run: cargo test --all-features --workspace
      
      - name: Clippy Lints
        run: cargo clippy --all-targets --all-features -- ${{ env.RUST_CLIPPY_ARGS }}
  build:
    name: Binary (${{ matrix.suffix }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  suffix: linux,   ext: "",     archive: "tar.gz"}
          - { os: windows-latest, suffix: windows, ext: ".exe", archive: "zip"}
          - { os: macos-latest,   suffix: macos,   ext: "",     archive: "tar.gz"}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_VERSION }}
    
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
    
    - name: Build Release Binary
      run: cargo build --release --locked
    - name: Package Binary
      id: package
      shell: bash
      env:
        ASSET: ${{ env.BIN_NAME}}-${{ matrix.suffix }}
        BIN: ${{ env.BIN_NAME }}${{ matrix.ext }}
      run: |
        if [ "${{ matrix.archive }}" = "zip" ]; then
          FILE="$ASSET.zip"
          (cd target/release && 7z a "../../$FILE" "$BIN")
        else
          FILE="$ASSET.tar.gz"
          tar czf "$FILE" -C target/release "$BIN"
        fi
        echo "archive=$FILE" >> "$GITHUB_OUTPUT"
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        path: ${{ steps.package.outputs.archive }}
        if-no-files-found: 'error'
        archive: false
        retention-days: 7
  notes:
    name: Release notes
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          set -euo pipefail
          
          PREV=$(git describe --tags --abbrev=0 --match 'v*.*.*' "${VERSION}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="${PREV}..${VERSION}"; else RANGE="$VERSION"; fi
          
          git log --no-merges --pretty=format:'- %s (%h)' "$RANGE" | head -n 200 > commits.md
          
          if [ ! -s commits.md ]; then
            echo "No changes recorded." > RELEASE_NOTES.md
            exit 0
          fi
          
          {
            echo "Write release notes in Markdown for version ${VERSION} of a command-line todo app, based only on the commit list below."
            echo "Group changes under these headings when applicable: Features, Fixes, Other. Skip empty groups."
            echo "Use short bullet points. No introduction, no closing remarks. Do not invent changes."
            echo
            echo "Commits:"
            cat commits.md
          } > prompt.txt
          
          jq -n --rawfile prompt prompt.txt '{contents:[{parts:[{text:$prompt}]}]}' > request.json
          
          if curl -sS --fail-with-body --retry 3 --retry-all-errors \
               "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent" \
               -H "x-goog-api-key: ${GEMINI_API_KEY}" \
               -H "Content-Type: application/json" \
               -d @request.json -o response.json \
             && jq -er '[.candidates[0].content.parts[]?.text] | join("")' response.json > generated.md \
             && [ -s generated.md ]; then
            cp generated.md RELEASE_NOTES.md
          else
            echo "::warning::Gemini notes failed, using the plain commit list"
            { echo "## Changes"; echo; cat commits.md; } > RELEASE_NOTES.md
          fi

      - name: Upload notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7
  release:
    name: Release
    needs: [build, notes]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: ${{ env.BIN_NAME }}-*
          merge-multiple: true
      - name: Download notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes

      - name: Checksum
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: notes/RELEASE_NOTES.md
          draft: true
